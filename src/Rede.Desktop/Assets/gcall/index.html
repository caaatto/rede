<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rede Call</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141c;
    --border: #262634;
    --text: #e8e8ee;
    --secondary: #8a8a9a;
    --accent: #8b5cf6;
    --accent-2: #2dd4bf;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
    overflow: hidden;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--secondary);
  }
  #status-bar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--secondary);
  }
  #status-bar.connected .dot { background: #22c55e; }
  #status-bar.connecting .dot { background: #eab308; animation: pulse 1.5s infinite; }
  #status-bar.failed .dot { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #e2ee-badge {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  #e2ee-badge.on { color: var(--accent-2); background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.3); }
  #e2ee-badge.off { color: var(--danger); background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }

  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  /* Normal grid mode (no screenshare) */
  #content:not(.has-screenshare) #grid {
    flex: 1;
    display: grid;
    gap: 8px;
    padding: 8px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    grid-auto-rows: 1fr;
    overflow: auto;
    min-height: 0;
  }
  #content:not(.has-screenshare) #focus-area { display: none; }

  /* Screenshare focus mode */
  #content.has-screenshare {
    flex-direction: column;
  }
  #content.has-screenshare #focus-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    min-height: 0;
    position: relative;
    cursor: pointer;
  }
  #content.has-screenshare #focus-area video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
    background: var(--surface);
  }
  #content.has-screenshare #focus-area .focus-label {
    position: absolute;
    top: 16px; left: 16px;
    padding: 4px 10px;
    background: rgba(139,92,246,0.85);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 2;
    pointer-events: none;
  }
  #content.has-screenshare #focus-area .focus-name {
    position: absolute;
    bottom: 16px; left: 16px;
    padding: 4px 10px;
    background: rgba(0,0,0,0.7);
    border-radius: 4px;
    font-size: 13px;
    z-index: 2;
    pointer-events: none;
  }
  #content.has-screenshare #grid {
    display: flex;
    flex-direction: row;
    gap: 6px;
    padding: 6px 8px;
    overflow-x: auto;
    overflow-y: hidden;
    flex-shrink: 0;
    height: 120px;
    min-height: 120px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #content.has-screenshare #grid .tile {
    width: 160px;
    min-width: 160px;
    height: 100%;
    aspect-ratio: auto;
  }

  /* Fullscreen focus */
  #focus-area.fullscreen {
    position: fixed !important;
    inset: 0;
    z-index: 100;
    background: #000;
    padding: 0 !important;
    border-radius: 0;
  }
  #focus-area.fullscreen video {
    border-radius: 0 !important;
  }

  .tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--secondary);
  }
  .tile .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 600;
    color: white;
  }
  .tile .name {
    position: absolute;
    left: 10px; bottom: 10px;
    padding: 4px 8px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    font-size: 12px;
  }
  .tile .mute-indicator {
    position: absolute;
    top: 10px; right: 10px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .tile.speaking {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 2px rgba(45,212,191,0.4);
  }
  /* Small avatar for sidebar tiles in screenshare mode */
  #content.has-screenshare #grid .tile .avatar {
    width: 40px; height: 40px;
    font-size: 16px;
  }
  #content.has-screenshare #grid .tile .name {
    font-size: 10px;
    left: 4px; bottom: 4px;
    padding: 2px 6px;
  }

  #controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  button.ctrl {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #1e1e28;
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  button.ctrl:hover { background: #2a2a38; }
  button.ctrl.active { background: var(--danger); border-color: var(--danger); }
  button.ctrl.leave { background: var(--danger); border-color: var(--danger); }
  button.ctrl.leave:hover { background: #dc2626; }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }

  #error-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 32px;
    text-align: center;
  }
  #error-overlay.visible { display: flex; }
  #error-overlay h2 { color: var(--danger); margin: 0; }
  #error-overlay p { color: var(--secondary); max-width: 400px; }
</style>
</head>
<body>
<div id="app">
  <div id="status-bar" class="connecting">
    <span class="dot"></span>
    <span id="status-text">Connecting to call…</span>
    <span id="e2ee-badge" class="off">E2EE OFF</span>
  </div>
  <div id="content">
    <div id="focus-area"></div>
    <div id="grid"></div>
  </div>
  <div id="controls">
    <button class="ctrl" id="btn-mic" title="Toggle microphone">MIC</button>
    <button class="ctrl" id="btn-deafen" title="Toggle deafen">DEF</button>
    <button class="ctrl" id="btn-cam" title="Toggle camera">CAM</button>
    <button class="ctrl" id="btn-screen" title="Share screen">SHARE</button>
    <button class="ctrl leave" id="btn-leave" title="Leave call">END</button>
  </div>
</div>
<div id="error-overlay">
  <h2 id="error-title">Call failed</h2>
  <p id="error-message"></p>
</div>

<script src="livekit-client.min.js"></script>
<script>
(function () {
  'use strict';

  const LK = window.LivekitClient;
  if (!LK) {
    showError('Runtime error', 'LiveKit client failed to load.');
    return;
  }

  // --- Config injection ---
  // Config (especially the SFrame E2EE key) is NEVER passed via the URL. The
  // C# host calls window.__redeInit(cfg) via ExecuteScriptAsync after the page
  // has loaded, so secrets never end up in process args, browser history, or
  // referer headers. Until __redeInit fires, the page sits in a "waiting"
  // state and does not connect to anything.
  let cfg = null;
  let initialized = false;

  window.__redeInit = function (c) {
    if (initialized) return;
    if (!c || typeof c !== 'object') return;
    if (!c.url || !c.token) {
      showError('Missing config', 'The host did not provide a token or URL.');
      return;
    }
    cfg = {
      url: String(c.url),
      token: String(c.token),
      room: String(c.room || ''),
      identity: String(c.identity || 'anon'),
      displayName: String(c.displayName || ''),
      e2eeKey: String(c.e2eeKey || ''),
    };
    initialized = true;
    startCall();
  };

  // --- UI refs ---
  const statusBar = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');
  const e2eeBadge = document.getElementById('e2ee-badge');
  const grid = document.getElementById('grid');
  const btnMic = document.getElementById('btn-mic');
  const btnCam = document.getElementById('btn-cam');
  const btnDeafen = document.getElementById('btn-deafen');
  const btnScreen = document.getElementById('btn-screen');
  const btnLeave = document.getElementById('btn-leave');
  const content = document.getElementById('content');
  const focusArea = document.getElementById('focus-area');

  // --- Host bridge ---
  // Post messages back to the C# WebView host so Avalonia UI can react.
  function postHost(type, payload) {
    try {
      if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
        // WebView2 (Windows)
        window.chrome.webview.postMessage(JSON.stringify({ type, ...payload }));
      } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rede) {
        // WKWebView (macOS)
        window.webkit.messageHandlers.rede.postMessage({ type, ...payload });
      } else {
        // Fallback: log to console — the host can hook into console messages
        console.log('[REDE_HOST]', JSON.stringify({ type, ...payload }));
      }
    } catch (e) { /* ignore */ }
  }

  function setStatus(state, text) {
    statusBar.className = state;
    statusText.textContent = text;
  }

  function showError(title, msg) {
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-message').textContent = msg;
    document.getElementById('error-overlay').classList.add('visible');
    postHost('error', { title, message: msg });
  }

  setStatus('connecting', 'Waiting for host…');

function startCall() {
  if (!cfg) return;
  // --- E2EE setup ---
  // SFrame encryption key is passed from C# via query param (base64, 32 bytes).
  // It's derived client-side from the Place/Group Sender Key — the Rede server
  // and LiveKit SFU never see this key. If no key is provided, E2EE is disabled
  // and a warning is shown (should not happen in production).
  let keyProvider = null;
  let e2eeEnabled = false;
  if (cfg.e2eeKey) {
    try {
      keyProvider = new LK.ExternalE2EEKeyProvider();
      e2eeEnabled = true;
    } catch (e) {
      console.error('Failed to create E2EE key provider', e);
    }
  }

  // --- Room setup ---
  const roomOpts = {
    adaptiveStream: true,
    dynacast: true,
    publishDefaults: {
      videoSimulcastLayers: [LK.VideoPresets.h540, LK.VideoPresets.h216],
      audioPreset: LK.AudioPresets.music,
      red: true,
      dtx: true,
    },
    videoCaptureDefaults: {
      resolution: LK.VideoPresets.h720.resolution,
    },
  };
  if (e2eeEnabled) {
    roomOpts.e2ee = {
      keyProvider,
      worker: new Worker('livekit-client.e2ee.worker.js'),
    };
  }

  const room = new LK.Room(roomOpts);

  // --- Track rendering ---
  // tiles are keyed by the LiveKit participant identity, which is a per-room
  // pseudonym (not a userId). Display names arrive over the encrypted data
  // channel once a participant joins.
  const tiles = new Map(); // pseudonym -> { el, labelEl, displayName }
  const displayNames = new Map(); // pseudonym -> string

  function labelFor(pseudonym) {
    return displayNames.get(pseudonym) || (pseudonym.slice(0, 6));
  }

  function ensureTile(participant) {
    const id = participant.identity;
    let entry = tiles.get(id);
    if (entry) return entry.el;
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.identity = id;

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const label = labelFor(id);
    avatar.textContent = (label[0] || '?').toUpperCase();
    placeholder.appendChild(avatar);
    tile.appendChild(placeholder);

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = label;
    tile.appendChild(nameEl);

    grid.appendChild(tile);
    tiles.set(id, { el: tile, labelEl: nameEl, avatarEl: avatar });
    return tile;
  }

  function updateTileName(pseudonym, name) {
    if (!name) return;
    displayNames.set(pseudonym, name);
    const entry = tiles.get(pseudonym);
    if (entry) {
      entry.labelEl.textContent = name;
      entry.avatarEl.textContent = (name[0] || '?').toUpperCase();
    }
  }

  function removeTile(identity) {
    const entry = tiles.get(identity);
    if (entry) { entry.el.remove(); tiles.delete(identity); }
    // Exit focus mode if this participant was screen-sharing
    if (focusScreenOwner === identity) exitFocusMode();
    displayNames.delete(identity);
  }

  // Track which participant is currently screen-sharing in focus
  let focusScreenOwner = null; // participant identity or null

  function enterFocusMode(participant, publication) {
    focusScreenOwner = participant.identity;
    // Clear focus area
    while (focusArea.firstChild) focusArea.firstChild.remove();
    // Attach video
    const el = publication.track.attach();
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.objectFit = 'contain';
    focusArea.appendChild(el);
    // Label
    const label = document.createElement('div');
    label.className = 'focus-label';
    label.textContent = 'Screen';
    focusArea.appendChild(label);
    const nameEl = document.createElement('div');
    nameEl.className = 'focus-name';
    nameEl.textContent = labelFor(participant.identity) + ' is sharing';
    focusArea.appendChild(nameEl);
    content.classList.add('has-screenshare');
  }

  function exitFocusMode() {
    focusScreenOwner = null;
    while (focusArea.firstChild) focusArea.firstChild.remove();
    focusArea.classList.remove('fullscreen');
    content.classList.remove('has-screenshare');
  }

  // Double-click focus area to toggle fullscreen
  focusArea.addEventListener('dblclick', () => {
    focusArea.classList.toggle('fullscreen');
  });
  // Escape exits fullscreen
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && focusArea.classList.contains('fullscreen')) {
      focusArea.classList.remove('fullscreen');
    }
  });

  function attachTrack(participant, publication) {
    if (!publication.track) return;
    const isScreenShare = publication.source === LK.Track.Source.ScreenShare;
    if (isScreenShare) {
      enterFocusMode(participant, publication);
      return;
    }
    if (publication.source === LK.Track.Source.ScreenShareAudio) {
      // Screen share audio — attach hidden
      const el = publication.track.attach();
      el.style.display = 'none';
      el.dataset.screenAudio = participant.identity;
      document.body.appendChild(el);
      return;
    }
    ensureTile(participant);
    const entry = tiles.get(participant.identity);
    const tile = entry ? entry.el : null;
    if (!tile) return;
    const el = publication.track.attach();
    if (publication.kind === 'video') {
      el.style.width = '100%';
      el.style.height = '100%';
      el.style.objectFit = 'cover';
      const ph = tile.querySelector('.placeholder');
      if (ph) ph.style.display = 'none';
      tile.insertBefore(el, tile.firstChild);
    } else {
      // Audio elements — attach but don't display
      el.style.display = 'none';
      document.body.appendChild(el);
    }
  }

  function detachTrack(publication, participant) {
    if (!publication.track) return;
    publication.track.detach().forEach(el => el.remove());
    // Exit focus mode when screen share stops
    if (publication.source === LK.Track.Source.ScreenShare && participant) {
      if (focusScreenOwner === participant.identity) {
        exitFocusMode();
      }
    }
  }

  // --- Event wiring ---
  room.on(LK.RoomEvent.Connected, async () => {
    setStatus('connected', 'In call · ' + cfg.room.slice(0, 8));
    if (e2eeEnabled && keyProvider) {
      try {
        const raw = base64ToBytes(cfg.e2eeKey);
        await keyProvider.setKey(raw);
        await room.setE2EEEnabled(true);
        e2eeBadge.className = 'on';
        e2eeBadge.textContent = 'E2EE ON';
        // We are done with the raw E2EE key now — LK holds it internally.
        // Zero our copy of the base64 string (strings are immutable in JS so
        // this just drops the reference; GC will reclaim when possible).
        cfg.e2eeKey = '';
      } catch (e) {
        console.error('E2EE setup failed', e);
        showError('E2EE setup failed', 'Could not enable end-to-end encryption. Call aborted.');
        room.disconnect();
        return;
      }
    }
    // Seed our own display name so the local tile is correct immediately.
    if (cfg.displayName) {
      updateTileName(room.localParticipant.identity, cfg.displayName);
    }
    // Enable mic + cam by default
    try {
      await room.localParticipant.setMicrophoneEnabled(true);
      await room.localParticipant.setCameraEnabled(false); // camera off by default
      updateButtons();
    } catch (e) {
      console.error('Failed to enable devices', e);
    }
    ensureTile(room.localParticipant);
    // Broadcast our display name over the data channel. With E2EE on, this
    // packet is SFrame-encrypted too, so the LiveKit SFU sees only ciphertext.
    // Sending displayName via LiveKit JWT metadata would leak it to the SFU.
    publishHello();
    postHost('connected', { room: cfg.room, participants: room.numParticipants });
  });

  async function publishHello() {
    if (!cfg.displayName) return;
    try {
      const payload = new TextEncoder().encode(JSON.stringify({ t: 'hello', name: cfg.displayName }));
      await room.localParticipant.publishData(payload, { reliable: true });
    } catch (e) {
      console.warn('publishData(hello) failed', e);
    }
  }

  room.on(LK.RoomEvent.DataReceived, (payload, participant) => {
    if (!participant) return;
    try {
      const text = new TextDecoder().decode(payload);
      const obj = JSON.parse(text);
      if (obj && obj.t === 'hello' && typeof obj.name === 'string') {
        // Trust-on-first-use: bind a displayName to a pseudonym for this call
        // only. Since the packet arrives over the E2EE data channel, only
        // members who already share the SFrame key can set it.
        const clean = String(obj.name).slice(0, 64).replace(/[\u202a-\u202e\u2066-\u2069]/g, '');
        updateTileName(participant.identity, clean);
      }
    } catch (e) { /* ignore malformed */ }
  });

  room.on(LK.RoomEvent.ParticipantConnected, () => {
    // Re-announce so late joiners learn our name.
    publishHello();
  });

  room.on(LK.RoomEvent.Disconnected, (reason) => {
    setStatus('failed', 'Disconnected');
    postHost('disconnected', { reason: String(reason || '') });
  });

  room.on(LK.RoomEvent.Reconnecting, () => setStatus('connecting', 'Reconnecting…'));
  room.on(LK.RoomEvent.Reconnected, () => setStatus('connected', 'In call'));

  room.on(LK.RoomEvent.ParticipantConnected, (p) => {
    ensureTile(p);
    postHost('participant_joined', { identity: p.identity });
  });

  room.on(LK.RoomEvent.ParticipantDisconnected, (p) => {
    removeTile(p.identity);
    postHost('participant_left', { identity: p.identity });
  });

  room.on(LK.RoomEvent.TrackSubscribed, (track, publication, participant) => {
    attachTrack(participant, publication);
    // Respect deafen state for newly subscribed audio
    if (deafened && track.kind === 'audio') {
      try { track.setVolume(0); } catch(e) {}
    }
  });

  room.on(LK.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
    detachTrack(publication, participant);
  });

  room.on(LK.RoomEvent.LocalTrackPublished, (publication, participant) => {
    attachTrack(participant, publication);
  });

  room.on(LK.RoomEvent.LocalTrackUnpublished, (publication) => {
    detachTrack(publication, room.localParticipant);
  });

  room.on(LK.RoomEvent.ActiveSpeakersChanged, (speakers) => {
    const active = new Set(speakers.map(s => s.identity));
    for (const [id, entry] of tiles) {
      entry.el.classList.toggle('speaking', active.has(id));
    }
  });

  // --- Controls ---
  let deafened = false;
  let preMuteState = true; // was mic on before deafen?

  function updateButtons() {
    const lp = room.localParticipant;
    // Mic
    const micActive = lp.isMicrophoneEnabled && !deafened;
    btnMic.classList.toggle('active', !micActive);
    btnMic.textContent = micActive ? 'MIC' : 'MUTE';
    if (deafened) btnMic.disabled = true; else btnMic.disabled = false;
    // Deafen
    btnDeafen.classList.toggle('active', deafened);
    btnDeafen.textContent = deafened ? 'DEAF' : 'DEF';
    // Cam
    btnCam.classList.toggle('active', !lp.isCameraEnabled);
    btnCam.textContent = lp.isCameraEnabled ? 'CAM' : 'OFF';
    // Screen
    btnScreen.classList.toggle('active', lp.isScreenShareEnabled);
    btnScreen.textContent = lp.isScreenShareEnabled ? 'STOP' : 'SHARE';
  }

  btnMic.onclick = async () => {
    if (deafened) return;
    const lp = room.localParticipant;
    await lp.setMicrophoneEnabled(!lp.isMicrophoneEnabled);
    updateButtons();
  };
  btnDeafen.onclick = async () => {
    const lp = room.localParticipant;
    if (!deafened) {
      // Deafen: mute all remote audio + mute own mic
      preMuteState = lp.isMicrophoneEnabled;
      deafened = true;
      await lp.setMicrophoneEnabled(false);
      // Mute all subscribed audio tracks
      for (const p of room.remoteParticipants.values()) {
        for (const pub of p.audioTrackPublications.values()) {
          if (pub.track) pub.track.setVolume(0);
        }
      }
    } else {
      // Undeafen: restore audio + restore mic state
      deafened = false;
      await lp.setMicrophoneEnabled(preMuteState);
      for (const p of room.remoteParticipants.values()) {
        for (const pub of p.audioTrackPublications.values()) {
          if (pub.track) pub.track.setVolume(1);
        }
      }
    }
    updateButtons();
    postHost('deafen', { deafened });
  };
  btnCam.onclick = async () => {
    const lp = room.localParticipant;
    await lp.setCameraEnabled(!lp.isCameraEnabled);
    updateButtons();
  };
  btnScreen.onclick = async () => {
    const lp = room.localParticipant;
    try {
      await lp.setScreenShareEnabled(!lp.isScreenShareEnabled, { audio: true });
      updateButtons();
    } catch (e) {
      // User cancelled the screen picker — not an error
      console.log('Screen share toggle failed', e);
      updateButtons();
    }
  };
  btnLeave.onclick = async () => {
    await room.disconnect();
    postHost('left', {});
  };

  // --- Connect ---
  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  (async () => {
    try {
      await room.connect(cfg.url, cfg.token);
      // Token is no longer needed after the WS handshake — drop our reference.
      cfg.token = '';
    } catch (e) {
      console.error('Connection failed', e);
      showError('Connection failed', e.message || String(e));
    }
  })();

  // Expose for C# to call
  window.redeLeave = () => btnLeave.click();
  window.redeToggleMute = () => btnMic.click();
  window.redeToggleDeafen = () => btnDeafen.click();
  window.redeToggleScreen = () => btnScreen.click();
} // end startCall
})();
</script>
</body>
</html>
